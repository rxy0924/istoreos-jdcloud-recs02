name: Build iStoreOS for JDCloud RE-CS-02

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-recs02
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev device-tree-compiler

      - name: 拉取 iStoreOS 源码（istoreos-25.12）
        run: |
          git clone --depth 1 -b istoreos-25.12 https://github.com/istoreos/istoreos.git openwrt
          cd openwrt
          git log -1 --format='SOURCE COMMIT: %H (%ci)'

      - name: 下载设备 DTS（上游 OpenWrt 已合入）
        run: |
          BASE="https://raw.githubusercontent.com/openwrt/openwrt/53a8e7b2d47ca12a9fbb63e95da45ca59f117f8e/target/linux/qualcommax/files/arch/arm64/boot/dts/qcom"
          mkdir -p device
          curl -fsSL "$BASE/ipq6010-re-cs.dtsi" -o device/ipq6010-re-cs.dtsi
          curl -fsSL "$BASE/ipq6010-re-cs-02.dts" -o device/ipq6010-re-cs-02.dts
          wc -l device/*

      - name: 注入 RE-CS-02 设备支持
        run: |
          bash scripts/add-device.sh "$PWD/openwrt"
          git -C openwrt diff --stat

      - name: 配置与拉取 feeds
        run: |
          cd openwrt
          cp ../config/re-cs-02.config .config
          echo 'src-git kenzo https://github.com/kenzok8/small-package.git' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          echo "---- 关键配置 ----"
          grep -E "DEVICE_jdcloud_re-cs-02|luci-app-lucky|lucky=|clashoo|luci-app-oaf|open-app-filter|luci-app-store|CONFIG_PACKAGE_istore=" .config || true
          echo "---- 包存在性校验 ----"
          missing=0
          for p in luci-app-lucky lucky luci-app-clashoo clashoo luci-app-oaf open-app-filter; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then echo "OK   ${p}"; else echo "MISS ${p}"; missing=1; fi
          done
          if ! grep -q "DEVICE_jdcloud_re-cs-02=y" .config; then echo "MISS device"; missing=1; fi
          [ "$missing" = "0" ] || { echo '!! 关键包未选中，终止'; exit 1; }

      - name: 下载源码包
        run: |
          cd openwrt
          make -j"$(nproc)" download || make -j"$(nproc)" download || true
          df -h /

      - name: 编译
        run: |
          cd openwrt
          make -j"$(nproc)" 2>&1 | tee build.log
          echo "---- 产物 ----"
          ls -lh bin/targets/qualcommax/ipq60xx/

      - name: 校验 sysupgrade 兼容性并生成报告
        if: success()
        run: |
          cd openwrt
          FW=$(ls bin/targets/qualcommax/ipq60xx/*squashfs-sysupgrade.bin | head -1)
          {
            echo "# 构建报告"; echo
            echo "- 运行编号：#${{ github.run_number }}"
            echo "- 源码：istoreos-25.12（$(git rev-parse --short HEAD 2>/dev/null || echo n/a)）"
            echo "- 构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')"; echo
            echo "## 产物"; echo '```'; ls -lh bin/targets/qualcommax/ipq60xx/; echo '```'; echo
            echo "## SHA256"; echo '```'; sha256sum bin/targets/qualcommax/ipq60xx/*; echo '```'; echo
            echo "## sysupgrade 兼容元数据（fwtool -i）"; echo '```'
            ./staging_dir/host/bin/fwtool -i "$FW" || echo 'fwtool 读取失败'
            echo '```'; echo
            echo "## sysupgrade 包内容"; echo '```'; tar tf "$FW" | head -20; echo '```'
          } > ../build-report.md
          cat ../build-report.md

      - name: 提交构建报告（[skip ci]）
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add build-report.md
          git commit -m 'update build report [skip ci]' || echo 'no change'
          git push

      - name: 上传到 Release（可直接下载）
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: iStoreOS RE-CS-02 build #${{ github.run_number }}
          body_path: build-report.md
          files: |
            openwrt/bin/targets/qualcommax/ipq60xx/*
          fail_on_unmatched_files: false

      - name: 上传编译产物（Artifact）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-jdcloud-re-cs-02
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*
            openwrt/.config
          if-no-files-found: warn
          compression-level: 1

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: warn
