name: Build iStoreOS for JDCloud RE-CS-02

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-recs02
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev device-tree-compiler 2>&1 | tee setup.log

      - name: 拉取 iStoreOS 源码（istoreos-25.12）
        run: |
          set -o pipefail
          git clone --depth 1 -b istoreos-25.12 https://github.com/istoreos/istoreos.git openwrt 2>&1 | tee -a setup.log
          cd openwrt && git log -1 --format='SOURCE COMMIT: %H (%ci)' | tee -a ../setup.log

      - name: 下载设备 DTS（上游 OpenWrt 已合入）
        run: |
          BASE="https://raw.githubusercontent.com/openwrt/openwrt/53a8e7b2d47ca12a9fbb63e95da45ca59f117f8e/target/linux/qualcommax/files/arch/arm64/boot/dts/qcom"
          mkdir -p device
          curl -fsSL "$BASE/ipq6010-re-cs.dtsi" -o device/ipq6010-re-cs.dtsi
          curl -fsSL "$BASE/ipq6010-re-cs-02.dts" -o device/ipq6010-re-cs-02.dts
          wc -l device/*

      - name: 注入 RE-CS-02 设备支持
        run: |
          set -o pipefail
          bash scripts/add-device.sh "$PWD/openwrt" 2>&1 | tee -a setup.log

      - name: 拷入第三方应用包（只取需要的目录，避免整包 feed 的递归依赖冲突）
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/kenzok8/small-package.git /tmp/kenzo 2>&1 | tail -3
          git clone --depth 1 https://github.com/destan19/OpenAppFilter.git /tmp/oafsrc 2>&1 | tail -3
          for d in lucky luci-app-lucky luci-app-openclash; do
            cp -a "/tmp/kenzo/$d" "openwrt/package/$d"
          done
          for d in oaf open-app-filter luci-app-oaf; do
            cp -a "/tmp/oafsrc/$d" "openwrt/package/$d"
          done
          ls openwrt/package | grep -E 'lucky|clash|oaf|appfilter' | tee -a setup.log

      - name: 配置与 feeds
        run: |
          set -o pipefail
          cd openwrt
          cp ../config/re-cs-02.config .config
          ./scripts/feeds update -a 2>&1 | tee -a ../setup.log
          ./scripts/feeds install -a 2>&1 | tee -a ../setup.log
          make defconfig 2>&1 | tee -a ../setup.log
          echo '---- 关键配置 ----' | tee -a ../setup.log
          grep -E 'DEVICE_jdcloud_re-cs-02|lucky|clash|oaf|appfilter|luci-app-store|CONFIG_PACKAGE_istore=' .config | tee -a ../setup.log || true
          echo '---- 包存在性校验 ----' | tee -a ../setup.log
          missing=0
          for p in lucky luci-app-openclash; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then echo "OK   ${p}" | tee -a ../setup.log; else echo "MISS ${p}" | tee -a ../setup.log; missing=1; fi
          done
          if ! grep -q 'DEVICE_jdcloud_re-cs-02=y' .config; then echo 'MISS device' | tee -a ../setup.log; missing=1; fi
          for p in luci-app-lucky luci-app-oaf appfilter kmod-oaf; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then echo "OK   ${p}" | tee -a ../setup.log; else echo "WARN ${p} 未选中（不阻断编译）" | tee -a ../setup.log; fi
          done
          [ "$missing" = "0" ] || { echo '!! 关键包未选中，终止' | tee -a ../setup.log; exit 1; }

      - name: 下载源码包
        run: |
          set -o pipefail
          cd openwrt
          make -j"$(nproc)" download 2>&1 | tee ../download.log || make -j"$(nproc)" download 2>&1 | tee -a ../download.log || true
          df -h /

      - name: 编译（失败时逐级剔除第三方应用）
        run: |
          set -o pipefail
          cd openwrt

          show_errors() {
            echo '---- 失败点 ----' | tee -a build.log
            grep -nE 'ERROR: |Error 2$|Error 1$|error: ' build.log | tail -20 | tee -a build.log || true
          }

          disable() {
            for s in "$@"; do
              sed -i -E "s/^CONFIG_PACKAGE_${s}=y/# CONFIG_PACKAGE_${s} is not set/" .config
            done
            make oldconfig </dev/null >/dev/null 2>&1 || true
            echo "[回退] 已关闭: $*" | tee -a build.log
          }

          if ! make -j"$(nproc)" 2>&1 | tee build.log; then
            show_errors
            echo '>> 回退 1：移除 OAF 三件套' | tee -a build.log
            disable kmod-oaf appfilter luci-app-oaf luci-i18n-oaf-zh-cn
            if ! make -j"$(nproc)" >> build.log 2>&1; then
              show_errors
              echo '>> 回退 2：移除 OpenClash' | tee -a build.log
              disable luci-app-openclash luci-i18n-openclash-zh-cn
              if ! make -j"$(nproc)" >> build.log 2>&1; then
                show_errors
                echo '>> 回退 3：移除 Lucky' | tee -a build.log
                disable lucky luci-app-lucky luci-i18n-lucky-zh-cn
                make -j"$(nproc)" >> build.log 2>&1
              fi
            fi
          fi

          echo '---- 产物 ----'
          ls -lh bin/targets/qualcommax/ipq60xx/ || true
          echo '---- 最终内置应用 ----'
          grep -E '^CONFIG_PACKAGE_(lucky|luci-app-lucky|luci-app-openclash|luci-app-oaf|appfilter|kmod-oaf)=y' .config > ../final-apps.txt || true
          cat ../final-apps.txt

      - name: 生成构建报告
        if: always()
        run: |
          cd openwrt
          {
            if [ "${{ job.status }}" = "success" ]; then echo "# 构建报告（成功）"; else echo "# 构建报告（失败，job: ${{ job.status }}）"; fi
            echo
            echo "- 运行编号：#${{ github.run_number }}"
            echo "- 源码：istoreos-25.12（$(git rev-parse --short HEAD 2>/dev/null || echo n/a)）"
            echo "- 时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "## 产物"
            echo '```'
            ls -lh bin/targets/qualcommax/ipq60xx/ 2>/dev/null || echo '(无产物目录)'
            echo '```'
            if [ -s ../final-apps.txt ]; then echo; echo "## 最终内置应用"; echo '```'; cat ../final-apps.txt; echo '```'; else echo; echo "## 最终内置应用"; echo '```'; echo '(全部第三方应用均被剔除)'; echo '```'; fi
            if ls bin/targets/qualcommax/ipq60xx/*squashfs-sysupgrade.bin >/dev/null 2>&1; then
              FW=$(ls bin/targets/qualcommax/ipq60xx/*squashfs-sysupgrade.bin | head -1)
              echo; echo "## SHA256"; echo '```'; sha256sum bin/targets/qualcommax/ipq60xx/*; echo '```'
              echo; echo "## sysupgrade 兼容元数据（fwtool -i）"; echo '```'
              ./staging_dir/host/bin/fwtool -i "$FW" 2>&1 || echo 'fwtool 读取失败'
              echo '```'
              echo; echo "## sysupgrade 包内容"; echo '```'; tar tf "$FW" 2>/dev/null | head -20; echo '```'
            fi
            if [ "${{ job.status }}" != "success" ]; then
              echo; echo "## setup.log 末尾"; echo '```'
              tail -n 40 ../setup.log 2>/dev/null || echo '(无 setup.log)'
              echo '```'
              echo; echo "## build.log 错误行"; echo '```'
              grep -nE 'ERROR: |Error 2$|Error 1$|error: |回退' build.log 2>/dev/null | tail -40 || echo '(无)'
              echo '```'
              echo; echo "## build.log 末尾"; echo '```'
              tail -n 60 build.log 2>/dev/null || echo '(无 build.log)'
              echo '```'
            fi
          } > ../build-report.md
          head -50 ../build-report.md

      - name: 提交构建报告（[skip ci]）
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add build-report.md
          git commit -m 'update build report [skip ci]' || echo 'no change'
          git push || echo 'push failed'

      - name: 上传到 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: iStoreOS RE-CS-02 build #${{ github.run_number }}
          body_path: build-report.md
          files: |
            openwrt/bin/targets/qualcommax/ipq60xx/*
          fail_on_unmatched_files: false

      - name: 上传产物（Artifact）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-jdcloud-re-cs-02
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*
            openwrt/.config
            final-apps.txt
          if-no-files-found: warn
          compression-level: 1

      - name: 上传日志（Artifact）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            setup.log
            download.log
            openwrt/build.log
          if-no-files-found: warn
